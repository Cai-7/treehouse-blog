# 钢琴：谱子 + 练琴记录。
# songs：放在乐谱本里的曲子，会画成五线谱，可以「示范」和「跟弹」。
#   notes 的写法（用空格隔开）：
#     C4 D4 E4        音名 + 八度。C4 是中央 C，范围 C4 到 C6
#     F#4 Bb4         升号写 #，降号写 b
#     G4*2            时值（拍数），不写就是 1 拍；*0.5 半拍，*1.5 附点四分，*4 全音符
#     R*1             休止
#     |               小节线（每两小节排成一行）
#   bpm：每分钟多少拍。
# items：练琴记录，会写在乐谱页边的空白处。
